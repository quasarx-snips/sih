<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Page - LunaP | Team KompilerZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #05050a;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            animation: launchImpactShake 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes launchImpactShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 3px) rotate(-0.3deg); }
            40% { transform: translate(3px, -2px) rotate(0.3deg); }
            60% { transform: translate(-2px, 1px) rotate(-0.1deg); }
            80% { transform: translate(1px, -1px) rotate(0.05deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        header {
            width: 100%;
            padding: 16px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 70;
            opacity: 0;
            animation: fadeInHeader 1s ease 0.5s forwards;
        }

        @keyframes fadeInHeader { to { opacity: 1; } }

        .gdg-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
        }

        .gdg-logo svg { width: 28px; height: 28px; }
        .gdg-text { display: flex; flex-direction: column; font-size: 13px; font-weight: 700; line-height: 1.2; }
        .gdg-sub { font-size: 9px; color: #a0a0a0; font-weight: 500; letter-spacing: 0.5px; }

        .main-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .hero-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .lunap-title {
            font-size: clamp(8rem, 25vw, 24rem); 
            font-weight: 900;
            letter-spacing: -0.09em;
            line-height: 0.75;
            margin: 0;
            visibility: hidden;
        }

        .icons-row {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            width: 100%;
        }

        .space-icon {
            width: clamp(140px, 23vw, 320px);
            height: clamp(140px, 23vw, 320px);
            aspect-ratio: 1/1;
            visibility: hidden;
        }

        .content-overlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 150;
            transform: translate(clamp(-800px, -17vw, -390px), clamp(70px, 9vw, 130px));
            pointer-events: none;
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 0 20px;
            gap: 12px;
        }

        .image-preview-box {
            width: clamp(180px, 30vw, 420px);
            height: clamp(130px, 22vw, 280px);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.45);
            background: rgba(5, 5, 10, 0.9);
            display: none;
            opacity: 0;
            transform: scale(0.7);
            align-items: center;
            justify-content: center;
            overflow: hidden;
            pointer-events: auto;
            box-shadow: 0 0 35px rgba(0,255,204,0.25);
            position: relative;
            z-index: 30;
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .image-preview-box.is-visible {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .image-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            border-radius: 0;
            transform: scale(1);
            transform-origin: center;
            transition: filter 0.5s ease;
        }

        .image-preview-box.is-buffering img {
            filter: blur(8px) brightness(0.75);
        }

        .scan-laser {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #00ffcc;
            box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
            display: none;
            z-index: 45;
            animation: scanLaserMove 2s ease-in-out infinite alternate;
        }

        @keyframes scanLaserMove {
            0% { top: 0%; opacity: 0.8; }
            100% { top: 98%; opacity: 0.8; }
        }

        .buffering-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.35);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            backdrop-filter: blur(2px);
        }

        .buffering-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(0, 255, 204, 0.2);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            animation: spinBuffer 0.9s linear infinite;
            margin-bottom: 8px;
        }

        .buffering-text {
            color: #00ffcc;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        @keyframes spinBuffer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-proceed {
            padding: 14px 32px;
            font-size: 1rem;
            visibility: hidden;
            pointer-events: auto;
            cursor: pointer;
            background: linear-gradient(135deg, #00ffcc, #38bdf8);
            border: none;
            color: #05050a;
            font-weight: 800;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            width: 100%;
            max-width: 240px;
        }

        .btn-proceed:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.8);
        }

        .btn-processing {
            padding: 14px 32px;
            font-size: 1rem;
            opacity: 0;
            display: none;
            pointer-events: auto;
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8, #7c3aed);
            border: none;
            color: #ffffff;
            font-weight: 800;
            border-radius: 8px;
            transition: opacity 0.8s ease, transform 0.3s ease;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
            width: 100%;
            max-width: 240px;
        }

        .btn-processing.is-visible {
            display: block;
            opacity: 1;
        }

        .btn-processing:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.8);
        }

        .moon-settled {
            visibility: visible;
            width: clamp(140px, 23vw, 320px);
            height: clamp(140px, 23vw, 320px);
            aspect-ratio: 1/1;
            transform: translate(clamp(-240px, -24vw, -130px), clamp(40px, 6vw, 90px)) scale(calc(90vh / clamp(140px, 23vw, 320px))) rotate(-720deg) !important;
            filter: drop-shadow(0 0 110px rgba(255, 255, 255, 0.85));
            z-index: 20;
        }

        .moon-animator {
            width: 100%;
            height: 100%;
            animation: moonImpactShake 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes moonImpactShake {
            0% { transform: translateY(-90px) scale(1.25); opacity: 0; }
            45% { transform: translateY(0) scale(0.93); opacity: 1; }
            65% { transform: translateY(14px) scale(1.04); }
            82% { transform: translateY(-6px) scale(0.98); }
            100% { transform: translateY(0) scale(1); }
        }

        @keyframes spinMoon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .moon-rotator {
            width: 100%;
            height: 100%;
            transform-origin: center;
            animation: spinMoon 50s linear infinite;
        }

        .hanging-earth-wrapper {
            position: absolute;
            top: -45px;
            left: 90%;
            transform: translateX(-50%) translateY(0px);
            transform-origin: top center;
            z-index: 55;
            pointer-events: none;
            width: 180px;
            height: 380px;
        }

        @keyframes spinEarth {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .earth-globe {
            transform-origin: 90px 325px;
            animation: spinEarth 30s linear infinite;
        }

        #orbit-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Expanding circle white flash overlay style */
        .screen-flash {
            position: fixed;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #ffffff;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.8s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .screen-flash.is-flashing {
            transform: translate(-50%, -50%) scale(100);
        }
    </style>
</head>
<body>

    <!-- White flash element -->
    <div class="screen-flash" id="screenFlash"></div>

    <canvas id="orbit-canvas"></canvas>

    <div class="hanging-earth-wrapper" id="earthWrapper">
        <svg viewBox="0 0 180 380" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
            <defs>
                <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8" />
                    <stop offset="50%" stop-color="#2563eb" />
                    <stop offset="100%" stop-color="#1e3a8a" />
                </linearGradient>
                <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4ade80" />
                    <stop offset="100%" stop-color="#166534" />
                </linearGradient>
                <filter id="earthGlow" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.65"/>
                </filter>
            </defs>
            <circle cx="90" cy="4" r="3.5" fill="#94a3b8" />
            <line x1="90" y1="4" x2="90" y2="280" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.2" stroke-linecap="round" />
            <g filter="url(#earthGlow)" class="earth-globe">
                <circle cx="90" cy="325" r="48" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" />
                <circle cx="90" cy="325" r="44" fill="url(#earthGrad)" />
                <path d="M70 305 C 78 295, 95 300, 102 312 C 110 325, 98 342, 85 346 C 72 350, 60 332, 70 305 Z" fill="url(#landGrad)" opacity="0.85" />
                <path d="M98 332 C 106 324, 122 328, 118 344 C 114 360, 102 356, 98 332 Z" fill="url(#landGrad)" opacity="0.85" />
                <path d="M64 326 C 56 318, 48 330, 56 342 C 64 354, 72 338, 64 326 Z" fill="url(#landGrad)" opacity="0.85" />
            </g>
        </svg>
    </div>

    <header>
        <a href="landing_page.html" class="gdg-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 8L3 12L7 16" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17 8L21 12L17 16" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M14 6L10 18" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div class="gdg-text">
                Team KompilerZ
                <span class="gdg-sub">DevJams'26 • Gravitas • GDG</span>
            </div>
        </a>
    </header>

    <main class="main-container" aria-hidden="true">
        <div class="hero-wrapper">
            <h1 class="lunap-title">
                <span class="char">L</span><span class="char">u</span><span class="char">n</span><span class="char">a</span><span class="char">P</span>
            </h1>

            <div class="icons-row">
                <div class="space-icon"></div>
                <div class="moon-settled">
                    <div class="moon-animator">
                        <div class="moon-rotator">
                            <svg class="space-icon" style="width:100%; height:100%; visibility:visible;" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="smoothGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#f1f5f9" />
                                        <stop offset="60%" stop-color="#94a3b8" />
                                        <stop offset="100%" stop-color="#334155" />
                                    </linearGradient>
                                </defs>
                                <circle cx="50" cy="50" r="44" fill="url(#smoothGrad2)" />
                                <circle cx="38" cy="45" r="10" fill="#1e293b" opacity="0.6"/>
                                <circle cx="68" cy="62" r="9" fill="#1e293b" opacity="0.6"/>
                                <circle cx="60" cy="32" r="6" fill="#1e293b" opacity="0.6"/>
                                <circle cx="48" cy="68" r="5" fill="#1e293b" opacity="0.6"/>
                                <circle cx="28" cy="58" r="4" fill="#1e293b" opacity="0.6"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="space-icon"></div>
                <div class="space-icon"></div>
            </div>

            <div class="content-overlay" id="contentOverlay">
                <div class="image-preview-box" id="imagePreviewBox">
                    <img id="previewImg" src="" alt="Uploaded Preview">
                    <div class="scan-laser" id="scanLaser"></div>
                    <div class="buffering-overlay" id="bufferingOverlay">
                        <div class="buffering-spinner"></div>
                        <div class="buffering-text" id="bufferingText">Scanning...</div>
                    </div>
                </div>
                <button class="btn-proceed" id="uploadBtn">Upload Image</button>
                <button class="btn-processing" id="processingBtn">Process image</button>
            </div>
        </div>

        <input type="file" id="imageInput" accept="image/*" style="display: none;">
    </main>

    <script>
        const canvas = document.getElementById('orbit-canvas');
        const ctx = canvas.getContext('2d');
        const screenFlash = document.getElementById('screenFlash');
        let hasFlashed = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let missionState = 'EARTH_ORBIT';
        let previousMissionState = 'EARTH_ORBIT';

        let eccentricAnomaly = 0;
        const semiMajorAxis = 96; 
        const semiMinorAxis = 96; 
        const eccentricity = 0.22; 
        const inclination = Math.PI / 4; 

        let transferProgress = 0;
        const transferDurationFrames = 180; 
        let transferStartPos = { x: 0, y: 0 };
        let lunarOrbitAngle = 0;
        let scaleFactor = 1.0;

        let spawnFrames = 0;
        const spawnDuration = 80;

        let lunarSpawnFrames = 80;
        const lunarSpawnDuration = 80;
        let lunarSpawnPos = { x: 0, y: 0 };

        let pendingImageData = null;

        // Returning trip variables
        let isReturning = false;
        let returnProgress = 0;
        const returnDurationFrames = 180;
        let returnStartPos = { x: 0, y: 0 };

        // Shrinking photo variables
        let isShrinking = false;
        let shrinkProgress = 0;
        let shrinkStartRect = null;
        let shrinkTargetPos = { x: 0, y: 0 };

        const uploadBtn = document.getElementById('uploadBtn');
        const processingBtn = document.getElementById('processingBtn');
        const imageInput = document.getElementById('imageInput');
        const imagePreviewBox = document.getElementById('imagePreviewBox');
        const previewImg = document.getElementById('previewImg');
        const scanLaser = document.getElementById('scanLaser');
        const bufferingOverlay = document.getElementById('bufferingOverlay');
        const bufferingText = document.getElementById('bufferingText');

        let isScanning = false;

        setTimeout(() => {
            uploadBtn.style.visibility = 'visible';
        }, 800);

        uploadBtn.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = function(evt) {
                    pendingImageData = evt.target.result;
                };
                reader.readAsDataURL(file);

                uploadBtn.style.display = 'none';
                
                const earthRect = document.getElementById('earthWrapper').getBoundingClientRect();
                const earthCenterX = earthRect.left + earthRect.width / 2;
                const earthCenterY = earthRect.top + 325;
                
                const x_orb = semiMajorAxis * (Math.cos(eccentricAnomaly) - eccentricity);
                const y_orb = semiMinorAxis * Math.sqrt(1 - eccentricity * eccentricity) * Math.sin(eccentricAnomaly);
                const cosI = Math.cos(inclination);
                const sinI = Math.sin(inclination);
                
                transferStartPos = {
                    x: earthCenterX + (x_orb * cosI - y_orb * sinI),
                    y: earthCenterY + (x_orb * sinI + y_orb * cosI)
                };

                missionState = 'TLI_BURN';
                setTimeout(() => {
                    missionState = 'TRANSFER';
                    transferProgress = 0;
                }, 600);
            }
        });

        processingBtn.addEventListener('click', () => {
            isScanning = true;
            processingBtn.textContent = 'Scanning in progress...';
            processingBtn.style.pointerEvents = 'none';

            imagePreviewBox.classList.add('is-buffering');
            scanLaser.style.display = 'block';
            bufferingOverlay.style.display = 'flex';

            setTimeout(() => {
                bufferingText.textContent = 'Decrypting Data...';
            }, 8000);

            setTimeout(() => {
                bufferingText.textContent = 'Applying CLAHE Enhancement...';
            }, 16000);

            setTimeout(() => {
                bufferingText.textContent = 'Revealing Result...';
            }, 24000);

            setTimeout(() => {
                bufferingOverlay.style.display = 'none';
                scanLaser.style.display = 'none';
                imagePreviewBox.classList.remove('is-buffering');
                processingBtn.style.display = 'none';
                isScanning = false;

                // Trigger shrinking of photo into the satellite
                shrinkStartRect = imagePreviewBox.getBoundingClientRect();
                imagePreviewBox.style.transition = 'none';
                imagePreviewBox.style.position = 'fixed';
                imagePreviewBox.style.left = shrinkStartRect.left + 'px';
                imagePreviewBox.style.top = shrinkStartRect.top + 'px';
                imagePreviewBox.style.width = shrinkStartRect.width + 'px';
                imagePreviewBox.style.height = shrinkStartRect.height + 'px';
                imagePreviewBox.style.margin = '0';
                
                isShrinking = true;
                shrinkProgress = 0;
            }, 30000);
        });

        function renderOrbit() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const earthRect = document.getElementById('earthWrapper').getBoundingClientRect();
            const earthCenterX = earthRect.left + earthRect.width / 2;
            const earthCenterY = earthRect.top + 325; 

            const moonElement = document.querySelector('.moon-settled');
            const moonRect = moonElement.getBoundingClientRect();
            const moonCenterX = moonRect.left + moonRect.width / 2;
            const moonCenterY = moonRect.top + moonRect.height / 2;

            let satX = 0, satY = 0, currentRotation = 0;

            if (missionState === 'EARTH_ORBIT' || missionState === 'TLI_BURN') {
                const meanMotion = 0.012;
                eccentricAnomaly += meanMotion * (1 / (1 - eccentricity * Math.cos(eccentricAnomaly)));

                const x_orb = semiMajorAxis * (Math.cos(eccentricAnomaly) - eccentricity);
                const y_orb = semiMinorAxis * Math.sqrt(1 - eccentricity * eccentricity) * Math.sin(eccentricAnomaly);

                const cosI = Math.cos(inclination);
                const sinI = Math.sin(inclination);
                const x_rot = x_orb * cosI - y_orb * sinI;
                const y_rot = x_orb * sinI + y_orb * cosI;

                satX = earthCenterX + x_rot;
                satY = earthCenterY + y_rot;
                currentRotation = eccentricAnomaly + Math.PI / 4;

                if (missionState === 'TLI_BURN') {
                    ctx.save();
                    ctx.translate(satX, satY);
                    ctx.rotate(currentRotation);
                    ctx.beginPath();
                    ctx.moveTo(-18, 0);
                    ctx.lineTo(-35 - Math.random() * 15, 0);
                    ctx.strokeStyle = '#00ffcc';
                    ctx.lineWidth = 4;
                    ctx.shadowColor = '#00ffcc';
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                    ctx.restore();
                }
            } 
            else if (missionState === 'TRANSFER') {
                transferProgress += 1 / transferDurationFrames;
                if (transferProgress >= 1) {
                    missionState = 'LUNAR_ORBIT';
                    lunarOrbitAngle = Math.PI; 
                    
                    if (pendingImageData) {
                        previewImg.src = pendingImageData;
                        imagePreviewBox.classList.add('is-visible');
                        processingBtn.classList.add('is-visible');
                    }
                    transferProgress = 1;
                }

                const t = transferProgress;
                const easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                const controlX = (transferStartPos.x + moonCenterX) / 2 - 80;
                const controlY = (transferStartPos.y + moonCenterY) / 2 - 120;

                satX = (1 - easeT) * (1 - easeT) * transferStartPos.x + 2 * (1 - easeT) * easeT * controlX + easeT * easeT * moonCenterX;
                satY = (1 - easeT) * (1 - easeT) * transferStartPos.y + 2 * (1 - easeT) * easeT * controlY + easeT * easeT * moonCenterY;
                
                scaleFactor = 1.0 + (easeT * 0.4);
                currentRotation = easeT * Math.PI * 2;

                ctx.save();
                ctx.beginPath();
                ctx.arc(satX, satY, 12 * scaleFactor, 0, Math.PI * 2);
                const exhaustGrad = ctx.createRadialGradient(satX, satY, 0, satX, satY, 16 * scaleFactor);
                exhaustGrad.addColorStop(0, 'rgba(0, 255, 204, 0.8)');
                exhaustGrad.addColorStop(1, 'rgba(0, 255, 204, 0)');
                ctx.fillStyle = exhaustGrad;
                ctx.fill();
                ctx.restore();
            } 
            else if (missionState === 'LUNAR_ORBIT') {
                if (!isReturning) {
                    lunarOrbitAngle += 0.015;
                    const orbitRadiusX = 375;
                    const orbitRadiusY = 375;
                    satX = moonCenterX + Math.cos(lunarOrbitAngle) * orbitRadiusX;
                    satY = moonCenterY + Math.sin(lunarOrbitAngle) * orbitRadiusY;
                    scaleFactor = 1.35; 
                    currentRotation = lunarOrbitAngle + Math.PI / 2;

                    ctx.beginPath();
                    ctx.ellipse(moonCenterX, moonCenterY, orbitRadiusX, orbitRadiusY, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(0, 255, 204, 0.25)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                } else {
                    returnProgress += 1 / returnDurationFrames;
                    if (returnProgress >= 1) {
                        returnProgress = 1;
                        if (!hasFlashed) {
                            hasFlashed = true;
                            // Set flash origin to Earth center where the satellite lands
                            screenFlash.style.left = earthCenterX + 'px';
                            screenFlash.style.top = earthCenterY + 'px';
                            screenFlash.classList.add('is-flashing');

                            // Hand the uploaded frame off to the analysis suite,
                            // then continue through the white flash into analysis.html
                            try {
                                if (pendingImageData) {
                                    sessionStorage.setItem('lunapImage', pendingImageData);
                                }
                            } catch (err) { /* storage unavailable - proceed anyway */ }

                            setTimeout(() => {
                                window.location.href = 'analysis.html';
                            }, 950);
                        }
                    }
                    const t = returnProgress;
                    const easeT = t * t * (3 - 2 * t);

                    satX = (1 - easeT) * returnStartPos.x + easeT * earthCenterX;
                    satY = (1 - easeT) * returnStartPos.y + easeT * earthCenterY;
                    scaleFactor = 1.35 * (1 - easeT * 0.5);
                    currentRotation += 0.05;

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(satX, satY, 12 * scaleFactor, 0, Math.PI * 2);
                    const backExhaust = ctx.createRadialGradient(satX, satY, 0, satX, satY, 20 * scaleFactor);
                    backExhaust.addColorStop(0, 'rgba(56, 189, 248, 0.9)');
                    backExhaust.addColorStop(1, 'rgba(56, 189, 248, 0)');
                    ctx.fillStyle = backExhaust;
                    ctx.fill();
                    ctx.restore();
                }
            }

            if (missionState === 'LUNAR_ORBIT' && previousMissionState !== 'LUNAR_ORBIT') {
                lunarSpawnFrames = 0;
                lunarSpawnPos = { x: satX, y: satY };
            }
            previousMissionState = missionState;

            if (spawnFrames < spawnDuration) {
                const progress = spawnFrames / spawnDuration;
                ctx.save();
                
                const init_x_orb = semiMajorAxis * (Math.cos(0) - eccentricity);
                const init_y_orb = 0;
                const cosI = Math.cos(inclination);
                const sinI = Math.sin(inclination);
                const initX = earthCenterX + (init_x_orb * cosI - init_y_orb * sinI);
                const initY = earthCenterY + (init_x_orb * sinI + init_y_orb * cosI);

                ctx.translate(initX, initY);

                ctx.beginPath();
                ctx.arc(0, 0, progress * 80, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 204, ${1 - progress})`;
                ctx.lineWidth = 2.5 * (1 - progress);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, progress * 45, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(56, 189, 248, ${(1 - progress) * 0.8})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();
                spawnFrames++;
            }

            if (lunarSpawnFrames < lunarSpawnDuration) {
                const progress = lunarSpawnFrames / lunarSpawnDuration;
                ctx.save();
                ctx.translate(lunarSpawnPos.x, lunarSpawnPos.y);

                ctx.beginPath();
                ctx.arc(0, 0, progress * 80, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 204, ${1 - progress})`;
                ctx.lineWidth = 2.5 * (1 - progress);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, progress * 45, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(56, 189, 248, ${(1 - progress) * 0.8})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.restore();
                lunarSpawnFrames++;
            }

            ctx.save();
            ctx.translate(satX, satY);
            ctx.rotate(currentRotation);
            ctx.scale(scaleFactor, scaleFactor);

            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 18;

            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-18, -4, 36, 8);
            ctx.strokeStyle = '#bae6fd';
            ctx.lineWidth = 1;
            ctx.strokeRect(-18, -4, 36, 8);

            ctx.fillStyle = '#7c3aed';
            ctx.fillRect(-7, -7, 14, 14);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-7, -7, 14, 14);

            ctx.beginPath();
            ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ff2a6d';
            ctx.fill();

            ctx.restore();

            // Handle the shrinking image animation into the satellite
            if (isShrinking) {
                shrinkProgress += 0.025; 
                if (shrinkProgress >= 1) {
                    shrinkProgress = 1;
                    isShrinking = false;
                    imagePreviewBox.style.display = 'none';

                    // Once photo is sucked into the satellite, start return trip to earth!
                    isReturning = true;
                    returnProgress = 0;
                    returnStartPos = { x: satX, y: satY };
                }

                const ease = shrinkProgress * shrinkProgress; 
                const currentLeft = (1 - ease) * shrinkStartRect.left + ease * satX;
                const currentTop = (1 - ease) * shrinkStartRect.top + ease * satY;
                const currentWidth = (1 - ease) * shrinkStartRect.width;
                const currentHeight = (1 - ease) * shrinkStartRect.height;
                const currentOpacity = 1 - shrinkProgress;

                imagePreviewBox.style.left = currentLeft + 'px';
                imagePreviewBox.style.top = currentTop + 'px';
                imagePreviewBox.style.width = Math.max(0, currentWidth) + 'px';
                imagePreviewBox.style.height = Math.max(0, currentHeight) + 'px';
                imagePreviewBox.style.opacity = currentOpacity;
                imagePreviewBox.style.transform = `scale(${1 - shrinkProgress})`;
            }

            requestAnimationFrame(renderOrbit);
        }

        requestAnimationFrame(renderOrbit);
    </script>
</body>
</html>
